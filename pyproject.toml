[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-ledger"
version = "0.2.0"
description = "Durable project-reality compiler and read-only control substrate for distributed project sources."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ledger = "ledger.cli:main"
ledger-mcp = "ledger.mcp_server:main"

[tool.setuptools]
py-modules = ["build_ledger"]

[tool.setuptools.packages.find]
include = ["ledger*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
