name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - wave*/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python entrypoints
        run: python -m py_compile build_ledger.py ledger/*.py

      - name: Run unit tests
        run: python -m unittest discover -s tests
